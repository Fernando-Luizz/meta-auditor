services:
  meta-auditor:
    build: .
    container_name: meta-auditor
    ports:
      - "8010:8000"
    env_file:
      - .env
    volumes:
      # Persistência do banco SQLite e JSONs brutos entre reinicializações
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
